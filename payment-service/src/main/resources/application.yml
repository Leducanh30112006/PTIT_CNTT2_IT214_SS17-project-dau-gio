# TODO Câu 1 + Câu 5: Chuyển các cấu hình dưới đây sang Config Server (config-repo/payment-service.yml).
#                    File này chỉ nên giữ lại spring.application.name và spring.config.import
server:
  port: 8083

spring:
  application:
    name: payment-service
  config:
    import: optional:configserver:http://localhost:8888
  datasource:
    url: jdbc:mysql://localhost:3306/shopmart_payment?createDatabaseIfNotExist=true
    username: root
    password: 123456
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: payment-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "*"

# Giả lập cổng thanh toán
payment:
  # Đặt true để cố tình làm thanh toán thất bại -> chứng minh Saga rollback (Câu 3)
  simulate-failure: false
  # Giao dịch vượt hạn mức sẽ thất bại (vd: đặt 3 chiếc MacBook = 84.000.000)
  max-amount: 80000000

# TODO Câu 1: eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

